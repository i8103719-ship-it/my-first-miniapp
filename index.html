<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мое первое TMA</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
            margin-top: 20px;
        }
        h1 { font-size: 24px; margin-bottom: 10px; }
        p { font-size: 16px; color: var(--tg-theme-hint-color, #666); }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <h1>Привет, <span id="user-name">друг</span>! 👋</h1>
    <p>Это мой первый Telegram Mini App.</p>
    
    <div class="card">
        <h3>Мои навыки:</h3>
        <p>🐍 Python / Aiogram 3</p>
        <p>📊 Google Sheets API</p>
        <p>🚀 Деплой на Railway</p>
    </div>

    <button onclick="showAlert()">Нажми на меня</button>

    <script>
        // Инициализируем Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Получаем имя пользователя из Telegram
        let userName = tg.initDataUnsafe?.user?.first_name || "друг";
        document.getElementById("user-name").innerText = userName;

        // Действие при нажатии на кнопку
        function showAlert() {
            tg.showAlert("Ура! Мой Mini App работает!");
            // Можно отправить данные обратно в бота (пока просто вибрируем)
            tg.HapticFeedback.impactOccurred('medium');
        }
    </script>
</body>
</html>
