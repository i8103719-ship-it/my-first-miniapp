<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на услугу</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        h2 { text-align: center; margin-bottom: 20px; }
        .form-group { width: 100%; max-width: 350px; margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, select {
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ccc;
            font-size: 16px; box-sizing: border-box;
            background-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            color: var(--tg-theme-text-color, #000000);
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 15px; border-radius: 10px;
            font-size: 16px; font-weight: bold; width: 100%; max-width: 350px;
            margin-top: 10px; cursor: pointer;
        }
        button:active { opacity: 0.8; }
    </style>
</head>
<body>
    <h2>Запись на услугу 💅</h2>
    
    <div class="form-group">
        <label>Ваше имя:</label>
        <input type="text" id="nameInput" placeholder="Введите имя">
    </div>

    <div class="form-group">
        <label>Выберите услугу:</label>
        <select id="serviceInput">
            <option value="Стрижка">Стрижка</option>
            <option value="Маникюр">Маникюр</option>
            <option value="Окрашивание">Окрашивание</option>
        </select>
    </div>

    <button onclick="sendData()">Записаться</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        // Подставляем имя из Telegram, если оно есть
        let userName = tg.initDataUnsafe?.user?.first_name;
        if (userName) {
            document.getElementById("nameInput").value = userName;
        }

        function sendData() {
            let name = document.getElementById("nameInput").value;
            let service = document.getElementById("serviceInput").value;

            if (!name) {
                tg.showAlert("Пожалуйста, введите имя!");
                return;
            }

            // Собираем данные в объект
            let data = {
                name: name,
                service: service
            };

            // Отправляем данные боту и закрываем окно
            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
