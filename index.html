<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>VOID — Clothing Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: var(--tg-theme-bg-color, #111111);
            --text: var(--tg-theme-text-color, #ffffff);
            --card: #1c1c1c;
            --muted: #888888;
            --accent: #d7ff3f;
            --border: rgba(255,255,255,.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 30px; }
        button { font-family: inherit; cursor: pointer; border: none; }
        .container { max-width: 600px; margin: auto; padding: 20px 16px; }
        
        /* HEADER */
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .logo { font-size: 27px; font-weight: 900; letter-spacing: 4px; }
        .logo span { color: var(--accent); }
        .cart-button { background: #252525; color: white; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 700; }
        .cart-count { background: var(--accent); color: #111; min-width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; }
        
        /* HERO */
        .hero { background: linear-gradient(135deg, #292929, #151515); border-radius: 20px; padding: 30px 23px; margin-bottom: 32px; min-height: 190px; position: relative; overflow: hidden; }
        .hero-label { color: var(--accent); font-size: 11px; font-weight: 800; letter-spacing: 3px; margin-bottom: 13px; }
        .hero h1 { font-size: 34px; line-height: 1.1; font-weight: 900; }
        .hero p { color: #999; font-size: 13px; margin-top: 12px; }
        
        /* CATALOG */
        .section-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .section-heading h2 { font-size: 22px; font-weight: 800; }
        .section-heading span { color: var(--muted); font-size: 12px; }
        
        .products-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; width: 100%; }
        .product-card { background: var(--card); border-radius: 16px; overflow: hidden; border: 1px solid var(--border); min-width: 0; }
        .product-image { width: 100%; height: 175px; background: #292929; overflow: hidden; }
        .product-image img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .product-info { padding: 13px; }
        .product-category { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; }
        .product-name { font-size: 14px; font-weight: 700; min-height: 34px; margin-bottom: 12px; }
        .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
        .product-price { font-size: 15px; font-weight: 800; }
        .add-button { background: var(--accent); color: #111; width: 38px; height: 38px; border-radius: 10px; font-size: 23px; font-weight: 500; flex-shrink: 0; }
        .add-button:active { transform: scale(.92); }
        
        /* CART MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 100; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: #191919; width: 100%; max-width: 600px; border-radius: 24px 24px 0 0; padding: 22px 18px; padding-bottom: max(25px, env(safe-area-inset-bottom)); max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .modal-header h2 { font-size: 23px; }
        .close-button { width: 35px; height: 35px; background: #292929; border-radius: 50%; color: white; font-size: 22px; }
        .cart-items { display: flex; flex-direction: column; gap: 13px; }
        .cart-item { display: flex; align-items: center; gap: 12px; background: #252525; padding: 10px; border-radius: 13px; }
        .cart-item img { width: 65px; height: 70px; object-fit: cover; border-radius: 9px; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-size: 13px; font-weight: 700; margin-bottom: 7px; }
        .cart-item-price { color: var(--accent); font-size: 13px; font-weight: 700; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
        .quantity-controls button { width: 25px; height: 25px; border-radius: 7px; background: #444; color: white; font-size: 17px; }
        .remove-button { background: transparent; color: #999; font-size: 22px; }
        .empty-cart { text-align: center; padding: 35px 10px; color: var(--muted); font-size: 14px; }
        .cart-footer { border-top: 1px solid var(--border); margin-top: 22px; padding-top: 20px; }
        .total-row { display: flex; justify-content: space-between; margin-bottom: 20px; align-items: center; }
        .total-row span:first-child { color: var(--muted); }
        .total-price { font-size: 23px; font-weight: 900; }
        .checkout-button { width: 100%; padding: 17px; border-radius: 13px; background: var(--accent); color: #111; font-size: 15px; font-weight: 900; }
        .checkout-button:disabled { opacity: .35; cursor: not-allowed; }
        
        /* TOAST */
        .toast { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--accent); color: #111; padding: 13px 20px; border-radius: 12px; font-size: 13px; font-weight: 700; opacity: 0; transition: .3s; pointer-events: none; z-index: 200; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        
        footer { text-align: center; color: #555; font-size: 11px; margin-top: 35px; letter-spacing: 2px; }
        @media(max-width: 350px) { .product-image { height: 135px; } .product-info { padding: 9px; } .product-price { font-size: 13px; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo">V<span>O</span>ID.</div>
        <button class="cart-button" onclick="openCart()">
            Корзина
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <section class="hero">
        <div class="hero-label">NEW COLLECTION 2026</div>
        <h1>YOUR STYLE.<br>YOUR RULES.</h1>
        <p>Одежда, которая говорит за тебя.</p>
    </section>

    <div class="section-heading">
        <h2>Каталог</h2>
        <span>04 PRODUCTS</span>
    </div>

    <!-- КОНТЕЙНЕР ДЛЯ КАРТОЧЕК -->
    <div class="products-grid" id="productsGrid"></div>
    <footer>VOID STORE — EST. 2026</footer>
</div>

<!-- МОДАЛЬНОЕ ОКНО КОРЗИНЫ -->
<div class="modal-overlay" id="cartModal" onclick="overlayClick(event)">
    <div class="modal">
        <div class="modal-header">
            <h2>Корзина</h2>
            <button class="close-button" onclick="closeCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems"></div>
        <div class="cart-footer" id="cartFooter">
            <div class="total-row">
                <span>Итого к оплате</span>
                <span class="total-price" id="totalPrice">0 ₽</span>
            </div>
            <button class="checkout-button" id="checkoutButton" onclick="checkout()">Оформить заказ</button>
        </div>
    </div>
</div>

<div class="toast" id="toast">Добавлено в корзину</div>

<script>
"use strict";

const tg = window.Telegram?.WebApp;
if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#111111");
}

const products = [
    { id: "sneakers", name: "Air Street Sneakers", category: "Кроссовки", price: 8990, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=700&q=85" },
    { id: "tshirt", name: "Essential Oversized Tee", category: "Футболка", price: 2490, image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=700&q=85" },
    { id: "cap", name: "Minimal Baseball Cap", category: "Кепка", price: 1990, image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=700&q=85" },
    { id: "hoodie", name: "Premium Black Hoodie", category: "Худи", price: 4990, image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=700&q=85" }
];

let cart = [];
try {
    const savedCart = JSON.parse(localStorage.getItem("void_cart"));
    if (Array.isArray(savedCart)) {
        cart = savedCart.filter(item => products.some(p => p.id === item.id) && Number.isInteger(item.quantity) && item.quantity > 0);
    }
} catch (error) { cart = []; }

function saveCart() {
    try { localStorage.setItem("void_cart", JSON.stringify(cart)); } catch (error) {}
}

function formatPrice(price) {
    return price.toLocaleString("ru-RU") + " ₽";
}

function renderProducts() {
    const grid = document.getElementById("productsGrid");
    if (!grid) return;
    grid.innerHTML = products.map(product => `
        <div class="product-card">
            <div class="product-image">
                <img src="${product.image}" alt="${product.name}" loading="eager">
            </div>
            <div class="product-info">
                <div class="product-category">${product.category}</div>
                <div class="product-name">${product.name}</div>
                <div class="product-bottom">
                    <div class="product-price">${formatPrice(product.price)}</div>
                    <button class="add-button" onclick="addToCart('${product.id}')">+</button>
                </div>
            </div>
        </div>
    `).join("");
}

function addToCart(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    const existing = cart.find(item => item.id === id);
    if (existing) { existing.quantity++; } else { cart.push({ id: id, quantity: 1 }); }
    saveCart();
    updateCartCount();
    showToast("Добавлено в корзину");
    if (tg?.HapticFeedback) { tg.HapticFeedback.impactOccurred("light"); }
}

function updateCartCount() {
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById("cartCount").textContent = count;
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    setTimeout(() => { toast.classList.remove("show"); }, 2000);
}

function openCart() {
    renderCart();
    document.getElementById("cartModal").classList.add("active");
    document.body.style.overflow = "hidden";
}

function closeCart() {
    document.getElementById("cartModal").classList.remove("active");
    document.body.style.overflow = "";
}

function overlayClick(event) {
    if (event.target.id === "cartModal") { closeCart(); }
}

function renderCart() {
    const container = document.getElementById("cartItems");
    const checkoutButton = document.getElementById("checkoutButton");
    let total = 0;

    if (cart.length === 0) {
        container.innerHTML = `<div class="empty-cart"><h3>Корзина пуста</h3><p>Добавьте товары из каталога</p></div>`;
        document.getElementById("totalPrice").textContent = "0 ₽";
        checkoutButton.disabled = true;
        return;
    }

    checkoutButton.disabled = false;
    container.innerHTML = cart.map(item => {
        const product = products.find(p => p.id === item.id);
        if (!product) return "";
        const itemTotal = product.price * item.quantity;
        total += itemTotal;
        return `
            <div class="cart-item">
                <img src="${product.image}" alt="${product.name}">
                <div class="cart-item-info">
                    <div class="cart-item-name">${product.name}</div>
                    <div class="cart-item-price">${formatPrice(itemTotal)}</div>
                    <div class="quantity-controls">
                        <button onclick="changeQuantity('${item.id}', -1)">−</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQuantity('${item.id}', 1)">+</button>
                    </div>
                </div>
                <button class="remove-button" onclick="removeFromCart('${item.id}')">×</button>
            </div>
        `;
    }).join("");

    document.getElementById("totalPrice").textContent = formatPrice(total);
}

function changeQuantity(id, amount) {
    const item = cart.find(item => item.id === id);
    if (!item) return;
    item.quantity += amount;
    if (item.quantity <= 0) { removeFromCart(id); return; }
    saveCart();
    updateCartCount();
    renderCart();
}

function removeFromCart(id) {
    cart = cart.filter(item => item.id !== id);
    saveCart();
    updateCartCount();
    renderCart();
}

function checkout() {
    if (cart.length === 0) return;

    // Формируем массив товаров и их количество
    const selectedItems = cart.map(item => ({ id: item.id, quantity: item.quantity }));

    if (tg && typeof tg.sendData === "function") {
        tg.sendData(JSON.stringify({ cart: selectedItems }));
        setTimeout(() => { tg.close(); }, 500);
    } else {
        alert("Ошибка: Telegram Web App не инициализирован.");
    }
}

// ЗАПУСК ПРИ ЗАГРУЗКЕ
renderProducts();
updateCartCount();
</script>
</body>
</html>
