<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>VOID — Clothing Store</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --tg-theme-bg-color: var(--tg-theme-bg-color, #111111);
            --tg-theme-text-color: var(--tg-theme-text-color, #ffffff);
            --tg-theme-hint-color: var(--tg-theme-hint-color, #888888);
            --tg-theme-button-color: var(--tg-theme-button-color, #ffffff);
            --tg-theme-button-text-color: var(--tg-theme-button-text-color, #111111);

            --bg: #111111;
            --card: #1c1c1c;
            --secondary: #252525;
            --text: #ffffff;
            --muted: #888888;
            --accent: #d7ff3f;
            --border: rgba(255,255,255,0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--tg-theme-bg-color, var(--bg));
            color: var(--tg-theme-text-color, var(--text));
            min-height: 100vh;
            padding-bottom: 30px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        .container {
            max-width: 600px;
            margin: auto;
            padding: 20px 16px;
        }

        /* HEADER */

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .logo span {
            color: var(--accent);
        }

        .cart-button {
            background: var(--secondary);
            color: white;
            padding: 12px 17px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 600;
            position: relative;
        }

        .cart-button svg {
            width: 19px;
            height: 19px;
        }

        .cart-count {
            background: var(--accent);
            color: #111;
            min-width: 19px;
            height: 19px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
        }

        /* HERO */

        .hero {
            background: linear-gradient(135deg, #242424, #151515);
            border-radius: 20px;
            padding: 30px 23px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            min-height: 190px;
        }

        .hero-label {
            color: var(--accent);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 13px;
        }

        .hero h1 {
            font-size: 34px;
            line-height: 1.1;
            font-weight: 900;
            max-width: 260px;
            letter-spacing: -1px;
        }

        .hero p {
            color: #999;
            font-size: 13px;
            margin-top: 12px;
        }

        .hero-decoration {
            position: absolute;
            right: -35px;
            bottom: -65px;
            width: 190px;
            height: 190px;
            border: 35px solid rgba(215,255,63,0.12);
            border-radius: 50%;
        }

        /* PRODUCTS */

        .section-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .section-heading h2 {
            font-size: 22px;
            font-weight: 800;
        }

        .section-heading span {
            color: var(--muted);
            font-size: 12px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 13px;
        }

        .product-card {
            background: var(--card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .product-image {
            height: 165px;
            background: #252525;
            position: relative;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform .3s ease;
        }

        .product-card:active .product-image img {
            transform: scale(1.05);
        }

        .product-info {
            padding: 13px;
        }

        .product-category {
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .product-name {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 12px;
            min-height: 34px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 5px;
        }

        .product-price {
            font-size: 15px;
            font-weight: 800;
            white-space: nowrap;
        }

        .add-button {
            background: var(--accent);
            color: #111;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: .2s;
            flex-shrink: 0;
        }

        .add-button:active {
            transform: scale(.9);
        }

        .add-button svg {
            width: 19px;
            height: 19px;
        }

        /* MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.75);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #191919;
            width: 100%;
            max-width: 600px;
            border-radius: 24px 24px 0 0;
            padding: 22px 18px;
            padding-bottom: max(25px, env(safe-area-inset-bottom));
            max-height: 85vh;
            overflow-y: auto;
            animation: slideUp .25s ease;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .modal-header h2 {
            font-size: 23px;
            font-weight: 800;
        }

        .close-button {
            width: 35px;
            height: 35px;
            background: #292929;
            border-radius: 50%;
            color: white;
            font-size: 20px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 13px;
            background: #222;
            padding: 10px;
            border-radius: 13px;
        }

        .cart-item img {
            width: 65px;
            height: 70px;
            object-fit: cover;
            border-radius: 9px;
        }

        .cart-item-info {
            flex: 1;
            min-width: 0;
        }

        .cart-item-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .cart-item-price {
            color: var(--accent);
            font-size: 13px;
            font-weight: 700;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .quantity-controls button {
            width: 25px;
            height: 25px;
            border-radius: 7px;
            background: #353535;
            color: white;
            font-size: 16px;
        }

        .quantity-controls span {
            font-size: 12px;
        }

        .remove-button {
            background: transparent;
            color: #888;
            font-size: 18px;
            padding: 8px;
        }

        .empty-cart {
            text-align: center;
            padding: 45px 10px;
            color: var(--muted);
        }

        .empty-cart svg {
            width: 45px;
            height: 45px;
            margin-bottom: 15px;
            opacity: .4;
        }

        .empty-cart h3 {
            color: white;
            font-size: 17px;
            margin-bottom: 8px;
        }

        .empty-cart p {
            font-size: 13px;
        }

        /* TOTAL */

        .cart-footer {
            border-top: 1px solid var(--border);
            margin-top: 22px;
            padding-top: 20px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .total-row span:first-child {
            color: var(--muted);
            font-size: 14px;
        }

        .total-price {
            font-size: 23px;
            font-weight: 900;
        }

        .checkout-button {
            width: 100%;
            padding: 17px;
            border-radius: 13px;
            background: var(--accent);
            color: #111;
            font-size: 15px;
            font-weight: 900;
            transition: .2s;
        }

        .checkout-button:disabled {
            opacity: .35;
            cursor: not-allowed;
        }

        .checkout-button:active:not(:disabled) {
            transform: scale(.98);
        }

        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--accent);
            color: #111;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: .3s;
            z-index: 200;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        footer {
            text-align: center;
            color: #555;
            font-size: 11px;
            margin-top: 35px;
            letter-spacing: 2px;
        }

        @media (max-width: 350px) {
            .product-image {
                height: 135px;
            }

            .product-info {
                padding: 10px;
            }

            .product-price {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <div class="logo">V<span>O</span>ID.</div>

        <button class="cart-button" onclick="openCart()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                <path d="M3 3h2l2.5 12h10.8l2.2-8H6"/>
                <circle cx="10" cy="19" r="1.5"/>
                <circle cx="18" cy="19" r="1.5"/>
            </svg>
            Корзина
            <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <section class="hero">
        <div class="hero-decoration"></div>
        <div class="hero-label">NEW COLLECTION 2026</div>
        <h1>YOUR STYLE.<br>YOUR RULES.</h1>
        <p>Одежда, которая говорит за тебя.</p>
    </section>

    <div class="section-heading">
        <h2>Каталог</h2>
        <span>04 PRODUCTS</span>
    </div>

    <div class="products" id="products"></div>

    <footer>
        VOID STORE — EST. 2026
    </footer>

</div>

<!-- CART MODAL -->

<div class="modal-overlay" id="cartModal" onclick="overlayClick(event)">

    <div class="modal">

        <div class="modal-header">
            <h2>Корзина</h2>
            <button class="close-button" onclick="closeCart()">×</button>
        </div>

        <div class="cart-items" id="cartItems"></div>

        <div class="cart-footer" id="cartFooter">

            <div class="total-row">
                <span>Итого к оплате</span>
                <span class="total-price" id="totalPrice">0 ₽</span>
            </div>

            <button class="checkout-button" id="checkoutButton" onclick="checkout()">
                Оформить заказ
            </button>

        </div>

    </div>

</div>

<div class="toast" id="toast">Добавлено в корзину</div>

<script>
    // TELEGRAM WEB APP

    const tg = window.Telegram?.WebApp;

    if (tg) {
        tg.ready();
        tg.expand();

        tg.setHeaderColor('#111111');
        tg.setBackgroundColor('#111111');

        if (tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
        }
    }

    // PRODUCTS

    const products = [
        {
            id: "sneakers",
            name: "Air Street Sneakers",
            category: "Обувь",
            price: 8990,
            image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&q=85"
        },
        {
            id: "tshirt",
            name: "Essential Oversized Tee",
            category: "Футболки",
            price: 2490,
            image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=600&q=85"
        },
        {
            id: "cap",
            name: "Minimal Baseball Cap",
            category: "Аксессуары",
            price: 1990,
            image: "https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=600&q=85"
        },
        {
            id: "hoodie",
            name: "Premium Black Hoodie",
            category: "Худи",
            price: 4990,
            image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&q=85"
        }
    ];

    // CART STORAGE

    let cart = [];

    try {
        const savedCart = JSON.parse(localStorage.getItem("void_cart"));
        if (Array.isArray(savedCart)) {
            cart = savedCart.filter(item =>
                products.some(product => product.id === item.id) &&
                Number.isInteger(item.quantity) &&
                item.quantity > 0
            );
        }
    } catch (error) {
        cart = [];
    }

    function saveCart() {
        localStorage.setItem("void_cart", JSON.stringify(cart));
    }

    // FORMAT PRICE

    function formatPrice(price) {
        return price.toLocaleString("ru-RU") + " ₽";
    }

    // RENDER PRODUCTS

    function renderProducts() {
        const container = document.getElementById("products");

        container.innerHTML = products.map(product => `
            <div class="product-card">

                <div class="product-image">
                    <img
                        src="${product.image}"
                        alt="${product.name}"
                        loading="lazy"
                    >
                </div>

                <div class="product-info">

                    <div class="product-category">
                        ${product.category}
                    </div>

                    <div class="product-name">
                        ${product.name}
                    </div>

                    <div class="product-bottom">

                        <div class="product-price">
                            ${formatPrice(product.price)}
                        </div>

                        <button
                            class="add-button"
                            onclick="addToCart('${product.id}')"
                            aria-label="Добавить в корзину"
                        >
                            <svg viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </button>

                    </div>
                </div>
            </div>
        `).join("");
    }

    // ADD TO CART

    function addToCart(id) {
        const existing = cart.find(item => item.id === id);

        if (existing) {
            existing.quantity++;
        } else {
            cart.push({
                id: id,
                quantity: 1
            });
        }

        saveCart();
        updateCartCount();
        showToast("Добавлено в корзину");

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred("light");
        }
    }

    // REMOVE PRODUCT

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);

        saveCart();
        updateCartCount();
        renderCart();
    }

    // CHANGE QUANTITY

    function changeQuantity(id, amount) {
        const item = cart.find(item => item.id === id);

        if (!item) return;

        item.quantity += amount;

        if (item.quantity <= 0) {
            removeFromCart(id);
            return;
        }

        saveCart();
        updateCartCount();
        renderCart();
    }

    // CART COUNTER

    function updateCartCount() {
        const count = cart.reduce(
            (sum, item) => sum + item.quantity,
            0
        );

        document.getElementById("cartCount").textContent = count;
    }

    // OPEN CART

    function openCart() {
        renderCart();

        document.getElementById("cartModal")
            .classList.add("active");

        document.body.style.overflow = "hidden";

        if (tg && tg.HapticFeedback) {
            tg.HapticFeedback.impactOccurred("light");
        }
    }

    // CLOSE CART

    function closeCart() {
        document.getElementById("cartModal")
            .classList.remove("active");

        document.body.style.overflow = "";
    }

    function overlayClick(event) {
        if (event.target.id === "cartModal") {
            closeCart();
        }
    }

    // RENDER CART

    function renderCart() {
        const container = document.getElementById("cartItems");
        const footer = document.getElementById("cartFooter");
        const checkoutButton = document.getElementById("checkoutButton");

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="empty-cart">
                    <svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.5">
                        <path d="M3 3h2l2.5 12h10.8l2.2-8H6"/>
                        <circle cx="10" cy="19" r="1.5"/>
                        <circle cx="18" cy="19" r="1.5"/>
                    </svg>
                    <h3>Корзина пуста</h3>
                    <p>Добавьте товары из каталога</p>
                </div>
            `;

            footer.style.display = "block";
            checkoutButton.disabled = true;

            document.getElementById("totalPrice").textContent = "0 ₽";
            return;
        }

        checkoutButton.disabled = false;
        footer.style.display = "block";

        let total = 0;

        container.innerHTML = cart.map(item => {
            const product = products.find(p => p.id === item.id);

            if (!product) return "";

            const itemTotal =
