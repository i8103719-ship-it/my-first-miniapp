<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запись на услугу</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--secondary-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--hint-color);
        }

        input, select {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid transparent;
            font-size: 16px;
            box-sizing: border-box;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border: 1px solid var(--button-color);
        }

        button {
            background-color: var(--button-color);
            color: var(--button-text);
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
            box-shadow: 0 4px 15px rgba(36, 129, 204, 0.3);
        }

        button:active {
            transform: scale(0.96);
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Запись на услугу ✨</h2>
        
        <div class="form-group">
            <label>Ваше имя:</label>
            <input type="text" id="nameInput" placeholder="Введите имя">
        </div>

        <div class="form-group">
            <label>Выберите услугу:</label>
            <select id="serviceInput">
                <option value="Стрижка">✂️ Стрижка</option>
                <option value="Маникюр">💅 Маникюр</option>
                <option value="Окрашивание">🎨 Окрашивание</option>
            </select>
        </div>

        <div class="form-group">
            <label>Удобное время:</label>
            <select id="timeInput">
                <option value="10:00">10:00</option>
                <option value="12:00">12:00</option>
                <option value="14:00">14:00</option>
                <option value="16:00">16:00</option>
                <option value="18:00">18:00</option>
            </select>
        </div>

        <button onclick="sendData()">Записаться</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        tg.setHeaderColor('#f4f4f5'); // Красим шапку под цвет карточки

        // Подставляем имя из Telegram
        let userName = tg.initDataUnsafe?.user?.first_name;
        if (userName) {
            document.getElementById("nameInput").value = userName;
        }

        function sendData() {
            let name = document.getElementById("nameInput").value;
            let service = document.getElementById("serviceInput").value;
            let time = document.getElementById("timeInput").value;

            if (!name.trim()) {
                tg.showAlert("Пожалуйста, введите имя!");
                return;
            }

            // Данные, которые улетят боту
            let data = {
                name: name,
                service: service,
                time: time
            };

            tg.sendData(JSON.stringify(data));
            
            // Закрываем через полсекунды, чтобы данные успели уйти
            setTimeout(() => {
                tg.close();
            }, 500); 
        }
    </script>
</body>
</html>
